[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-netlify-mcp"
version = "0.1.0"
description = "MCP server for TypeSafe Jev behind a free, key-locked Netlify proxy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]
keywords = ["mcp", "jev", "typesafe", "netlify", "claude", "codex"]

[project.scripts]
jev-netlify-mcp = "jev_netlify_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_netlify_mcp"]
